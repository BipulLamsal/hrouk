services:
  mysql:
    image: mysql:8.4
    container_name: hrouk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrouk
      MYSQL_USER: hrouk
      MYSQL_PASSWORD: hrouk
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --bind-address=0.0.0.0 --mysql-native-password=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
